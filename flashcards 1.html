<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flashcards</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#172033;--muted:#667085;--primary:#635bff;--border:#d8deea;--red:#d92d20;--orange:#e87516;--green:#16875d;--blue:#1570ef}body.dark{--bg:#10131a;--card:#1a1f2b;--text:#f4f7fb;--muted:#aab3c5;--border:#333b4e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}.app{max-width:900px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center}.screen{display:none}.screen.active{display:block}.panel,.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:26px;box-shadow:0 15px 40px #0002}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{text-align:center;border:1px solid var(--border);border-radius:14px;padding:15px}.stat b{display:block;font-size:1.5rem}.muted{color:var(--muted)}button{border:0;border-radius:12px;padding:13px 18px;font-weight:700;cursor:pointer}.primary{background:var(--primary);color:#fff}.secondary{background:transparent;color:var(--text);border:1px solid var(--border)}.danger{background:#fff0f0;color:var(--red)}.buttons{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:20px}.progress{height:14px;background:#ddd4;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,var(--primary),#a855f7)}.studyhead{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:15px}.studyhead div{text-align:center;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px}.card{min-height:350px;display:flex;flex-direction:column;justify-content:space-between;text-align:center}.content{font-size:clamp(1.3rem,4vw,2rem);white-space:pre-wrap;margin:auto}.answer{display:none;border-top:1px solid var(--border);padding-top:20px}.ratings{display:none;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:15px}.ratings button small{display:block;margin-top:5px}.again{color:var(--red);background:#fff0f0}.hard{color:var(--orange);background:#fff6ed}.good{color:var(--green);background:#ecfdf3}.easy{color:var(--blue);background:#eff8ff}input{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text)}label{font-weight:bold}.form{display:grid;grid-template-columns:1fr 1fr;gap:15px}@media(max-width:650px){.grid,.ratings{grid-template-columns:1fr 1fr}.studyhead,.form{grid-template-columns:1fr}.buttons{flex-direction:column}.buttons button{width:100%}}
</style>
</head>
<body><div class="app"><div class="top"><h2>Flashcards</h2><button id="theme" class="secondary">☾</button></div>
<section id="home" class="screen active"><div class="panel"><h1>Meu Baralho</h1><p class="muted">Repetição espaçada para estudar no momento certo.</p><div class="grid"><div class="stat"><b id="nNew">0</b>Novos</div><div class="stat"><b id="nLearn">0</b>Aprendendo</div><div class="stat"><b id="nDue">0</b>Para revisão</div><div class="stat"><b id="nDone">0</b>Hoje</div></div><h3>Meta diária: <span id="goalTxt"></span></h3><div class="progress"><div id="goalBar"></div></div><p id="goalMsg"></p><div class="buttons"><button id="start" class="primary">Iniciar estudo</button><button data-go="stats" class="secondary">Estatísticas</button><button data-go="settings" class="secondary">Configurações</button><button id="reset" class="danger">Reiniciar progresso</button></div></div></section>
<section id="study" class="screen"><div class="studyhead"><div>Cartão<br><b id="pos"></b></div><div>Meta<br><b id="daily"></b></div><div>Tempo<br><b id="timer">00:00</b></div></div><div class="card"><div><small>PERGUNTA</small><div id="question" class="content"></div><div id="answer" class="content answer"></div></div><button id="show" class="primary">Mostrar resposta</button></div><div id="ratings" class="ratings"><button class="again" data-rate="again">Errei<small>1 minuto</small></button><button class="hard" data-rate="hard">Difícil<small id="hardPrev"></small></button><button class="good" data-rate="good">Acertei<small id="goodPrev"></small></button><button class="easy" data-rate="easy">Fácil<small id="easyPrev"></small></button></div><p class="muted" style="text-align:center">Espaço: resposta · 1–4: avaliar · Esc: início</p></section>
<section id="settings" class="screen"><div class="panel"><h2>Configurações</h2><div class="form"><div><label>Mínimo diário</label><input id="min" type="number" min="1"></div><div><label>Máximo diário</label><input id="max" type="number" min="1"></div></div><p id="validation" style="color:var(--red)"></p><div class="buttons"><button id="save" class="primary">Salvar</button><button data-go="home" class="secondary">Cancelar</button></div></div></section>
<section id="stats" class="screen"><div class="panel"><h2>Estatísticas</h2><div id="statGrid" class="grid"></div><div class="buttons"><button data-go="home" class="primary">Voltar</button></div></div></section>
<section id="result" class="screen"><div class="panel"><h2>Sessão concluída</h2><div id="resultData" class="grid"></div><p id="nextReview" class="muted"></p><div class="buttons"><button data-go="home" class="secondary">Voltar ao início</button><button id="again" class="primary">Estudar novamente</button><button id="extra" class="secondary">Estudo extra</button></div></div></section>
</div><script>
const flashcards=[{id:1,pergunta:"[Digite a pergunta]",resposta:"[Digite a resposta]"},{id:2,pergunta:"[Digite a pergunta]",resposta:"[Digite a resposta]"},{id:3,pergunta:"[Digite a pergunta]",resposta:"[Digite a resposta]"}];
const KEY="flashcards_anki_offline_v1",MIN=60000,DAY=86400000,defaults={minimum:10,maximum:30,theme:"light"};let state=load(),session=null,current=null,startAt=0,tick=null,visible=false,locked=false;
function dateKey(d=new Date){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function freshCard(c){return{...c,correct:0,errors:0,streak:0,next:null,interval:0,last:null,lastTime:0,status:"novo",ease:2.5,reviews:0}}
function base(){return{settings:{...defaults},cards:flashcards.map(freshCard),daily:{date:dateKey(),ids:[],correct:0,errors:0,time:0,reviews:0},history:{},totals:{time:0,reviews:0}}}
function load(){let b=base();try{let x=JSON.parse(localStorage.getItem(KEY));if(!x)return b;b.settings={...b.settings,...x.settings};b.daily={...b.daily,...x.daily,ids:Array.isArray(x.daily?.ids)?[...new Set(x.daily.ids.map(String))]:[]};b.history=x.history||{};b.totals={...b.totals,...x.totals};let m=new Map((x.cards||[]).map(c=>[String(c.id),c]));b.cards=flashcards.map(c=>({...freshCard(c),...(m.get(String(c.id))||{}),...c}));return b}catch(e){return b}}
function persist(){localStorage.setItem(KEY,JSON.stringify(state))}function rollover(){if(state.daily.date!==dateKey()){if(state.daily.ids.length)state.history[state.daily.date]={...state.daily};state.daily={date:dateKey(),ids:[],correct:0,errors:0,time:0,reviews:0};persist()}}
function today(){rollover();return new Set(state.daily.ids).size}function due(c){return c.status!=="novo"&&c.next&&new Date(c.next).getTime()<=Date.now()}function capacity(){return Math.max(0,state.settings.maximum-today())}
function available(extra=false){rollover();if(!capacity())return[];let a=state.cards.filter(c=>!state.daily.ids.includes(String(c.id))&&(extra||c.status==="novo"||due(c)));return a.sort((a,b)=>(due(b)-due(a))||((a.status==="aprendendo"?0:a.status==="novo"?1:2)-(b.status==="aprendendo"?0:b.status==="novo"?1:2))||((new Date(a.next||0))-(new Date(b.next||0))))}
function showScreen(id){document.querySelectorAll(".screen").forEach(x=>x.classList.toggle("active",x.id===id));if(id!=="study")stopTimer();if(id==="home")home();if(id==="stats")stats()}
function home(){rollover();let count=s=>state.cards.filter(c=>c.status===s).length,done=today(),p=Math.min(100,done/state.settings.minimum*100);nNew.textContent=count("novo");nLearn.textContent=count("aprendendo");nDue.textContent=state.cards.filter(due).length;nDone.textContent=done;goalTxt.textContent=`${done} / ${state.settings.minimum}`;goalBar.style.width=p+"%";goalMsg.textContent=done>=state.settings.maximum?"Limite diário alcançado. Volte amanhã para continuar.":done>=state.settings.minimum?"Meta diária alcançada!":`Estude mais ${state.settings.minimum-done} cartão(ões) para atingir a meta mínima.`;start.disabled=!capacity()||(!available().length&&!available(true).length)}
function begin(extra=false){let list=available(extra).slice(0,capacity());session={ids:list.map(c=>c.id),i:0,studied:[],correct:0,errors:0,time:0};if(!list.length)return finish();showScreen("study");card()}
function card(){if(!session||session.i>=session.ids.length||!capacity())return finish();current=state.cards.find(c=>c.id===session.ids[session.i]);visible=locked=false;question.textContent=current.pergunta;answer.textContent=current.resposta;answer.style.display="none";showBtn(true);ratings.style.display="none";pos.textContent=`${session.i+1} / ${session.ids.length}`;daily.textContent=`${today()} / ${state.settings.minimum}`;hardPrev.textContent=fmtInterval(calc(current,"hard"));goodPrev.textContent=fmtInterval(calc(current,"good"));easyPrev.textContent=fmtInterval(calc(current,"easy"));startTimer()}
function showBtn(on){show.style.display=on?"block":"none"}function startTimer(){stopTimer();startAt=Date.now();timer.textContent="00:00";tick=setInterval(()=>timer.textContent=fmtTime(Date.now()-startAt),250)}function stopTimer(){clearInterval(tick);tick=null}
function reveal(){if(visible)return;visible=true;stopTimer();current._elapsed=Math.max(0,Date.now()-startAt);timer.textContent=fmtTime(current._elapsed);answer.style.display="block";showBtn(false);ratings.style.display="grid"}
function calc(c,r){let i=Math.max(0,+c.interval||0),e=Math.max(1.3,+c.ease||2.5),s=c.streak+1;if(r==="again")return MIN;if(r==="hard")return Math.max(10*MIN,i?i*1.2:10*MIN);if(r==="good")return s===1?DAY:s===2?3*DAY:Math.max(DAY,i*e);if(r==="easy")return s===1||!i?4*DAY:Math.max(4*DAY,i*e*1.3)}
function rate(r){if(!visible||locked)return;locked=true;let was=state.daily.ids.includes(String(current.id)),iv=calc(current,r),elapsed=current._elapsed||0;if(r==="again"){current.streak=0;current.errors++;current.status="aprendendo";current.ease=Math.max(1.3,current.ease-.2);session.errors++;state.daily.errors++}else{current.correct++;current.streak++;session.correct++;state.daily.correct++;if(r==="hard"){current.status=current.status==="novo"?"aprendendo":"revisão";current.ease=Math.max(1.3,current.ease-.15)}else{if(r==="easy")current.ease+=.15;current.status=current.streak>=5?"dominado":"revisão"}}current.interval=Math.max(MIN,Math.round(iv/MIN)*MIN);current.next=new Date(Date.now()+current.interval).toISOString();current.last=new Date().toISOString();current.lastTime=elapsed;current.reviews++;state.daily.reviews++;state.daily.time+=elapsed;state.totals.reviews++;state.totals.time+=elapsed;session.time+=elapsed;if(!was){state.daily.ids.push(String(current.id));session.studied.push(String(current.id))}save();setTimeout(()=>{session.i++;card()},150)}
function finish(){stopTimer();let s=session||{studied:[],correct:0,errors:0,time:0},n=new Set(s.studied).size,a=s.correct+s.errors,acc=a?Math.round(s.correct/a*100):0;resultData.innerHTML=statsHtml([["Estudados",n],["Acertos",s.correct],["Erros",s.errors],["Taxa",acc+"%"],["Tempo",fmtTime(s.time)],["Média",fmtTime(a?s.time/a:0)]]);let dates=state.cards.filter(c=>c.next).map(c=>new Date(c.next)).sort((a,b)=>a-b);nextReview.textContent="Próxima revisão: "+(dates[0]?dates[0].toLocaleString("pt-BR"):"nenhuma programada");again.style.display=available().length&&capacity()?"block":"none";extra.style.display=today()>=state.settings.minimum&&available(true).length&&capacity()?"block":"none";showScreen("result")}
function stats(){let c=s=>state.cards.filter(x=>x.status===s).length,a=state.daily.correct+state.daily.errors,avg=state.totals.reviews?state.totals.time/state.totals.reviews:0;statGrid.innerHTML=statsHtml([["Total",state.cards.length],["Novos",c("novo")],["Aprendendo",c("aprendendo")],["Revisão",c("revisão")],["Dominados",c("dominado")],["Acertos hoje",state.daily.correct],["Erros hoje",state.daily.errors],["Taxa",(a?Math.round(state.daily.correct/a*100):0)+"%"],["Estudados hoje",today()],["Meta",state.settings.minimum],["Limite",state.settings.maximum],["Tempo total",fmtTime(state.totals.time)],["Média",fmtTime(avg)],["Revisões",state.totals.reviews]])}
function statsHtml(a){return a.map(([l,v])=>`<div class="stat"><b>${v}</b>${l}</div>`).join("")}
function fmtTime(ms){let s=Math.floor(Math.max(0,ms)/1000),m=Math.floor(s/60);return `${String(m).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`}function fmtInterval(ms){let m=Math.round(ms/MIN);if(m<60)return m+" minuto(s)";let h=Math.round(m/60);if(h<24)return h+" hora(s)";return Math.round(h/24)+" dia(s)"}
start.onclick=()=>begin(!available().length);document.getElementById("show").onclick=reveal;document.querySelectorAll("[data-rate]").forEach(b=>b.onclick=()=>rate(b.dataset.rate));document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{if(b.dataset.go==="settings"){min.value=state.settings.minimum;max.value=state.settings.maximum}showScreen(b.dataset.go)});document.getElementById("save").onclick=()=>{let a=+min.value,b=+max.value;if(!Number.isInteger(a)||a<1||!Number.isInteger(b)||b<a)return validation.textContent="Informe números inteiros e deixe o máximo maior ou igual ao mínimo.";state.settings.minimum=a;state.settings.maximum=b;validation.textContent="";persist();showScreen("home")};reset.onclick=()=>{if(confirm("Apagar todo o progresso e restaurar as configurações padrão?")){state=base();persist();applyTheme();showScreen("home")}};again.onclick=()=>begin(false);extra.onclick=()=>begin(true);theme.onclick=()=>{state.settings.theme=state.settings.theme==="dark"?"light":"dark";persist();applyTheme()};function applyTheme(){document.body.classList.toggle("dark",state.settings.theme==="dark");theme.textContent=state.settings.theme==="dark"?"☀":"☾"}
document.addEventListener("keydown",e=>{if(e.key==="Escape")showScreen("home");if(!study.classList.contains("active"))return;if(e.code==="Space"&&!visible){e.preventDefault();reveal()}if(visible&&!locked){let m={1:"again",2:"hard",3:"good",4:"easy"};if(m[e.key])rate(m[e.key])}});rollover();applyTheme();home();
</script></body></html>
